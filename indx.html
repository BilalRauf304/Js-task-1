<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js-Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="indx.css">
    
</head>

<body>
    <h2 class="mt-5 ms-5 p-0">Age To Days Converter</h2>
    <input type="number" id="input" placeholder="Enter your Age" class="ms-5 mt-2">
    <button id="button-1" class="ms-4"> Converter </button>
    <div class="ms-5 mt-4 fs-5 fw-bold" id="result"></div>


    <!-- /////////////////////////////////////// HOURS TO SECOND CONVERTER //////////// -->
    <h2 id="hours" class="mt-5 ms-5">Hours To Second Converter</h2>
    <input type="number" id="input-sec" class="ms-5 ">
    <button id="button-2" class="ms-4" placeholder="ENTER HOURS">Convert</button>
    <div id="result-2" class="ms-5 mt-4 fs-5 fw-bold"></div>
    <!-- //////////////////////////////////////// -->

    <div class="mt-4 ms-5">
        <p>Array: [10, 20, 30, 40, 50]</p>
        <h2></h2>
        <input type="number" placeholder="" id="input-o">
        <button class="ms-4" id="button-3" onclick="aryFun()">Find Next</button>
        <p id="result-3"></p>
    </div>

    <div class="mt-3 ms-5">
        <h2> Find Next Number (User Input)</h2>
        <input id="userNumber" placeholder="Enter a number">
        <button class="ms-4" onclick="findNextNumber()">Find Next</button>
        <div id="userResult"></div>
    </div>
    <!-- ////////////////////////////////////////// -->
    <div class="mt-4 ms-5">
        <h2>BMI Calculator</h2>

        <label>Enter your weight (kg):</label><br>
        <input type="number" id="weightInput" placeholder="e.g. 70"><br>

        <label>Enter your height (meters):</label><br>
        <input type="number" step="0.01" id="heightInput" placeholder="e.g. 1.75"><br>

        <button class="ms-0 mt-3" onclick="calculateBMI()">Calculate BMI</button>

        <p class="result mt-3 fs-3" id="bmiResult"></p>

    </div>

    <!-- ///////////////////////////////////////////////// -->
    <div class=" ms-5 mt-5">
        <h2 id="enter-name">Please Enter His/Her Name</h2>
        <input type="text" id="input-feild" placeholder="in lowercase only">
        <button class="ms-4" id="button-4">Converte </button>
        <div id="result-4"></div>

    </div>


    
<script src="indx.js"></script>
</body>

</html>
