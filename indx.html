<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js-Task</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
         rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">
    <link rel="stylesheet" href="indx.css">
    <script src="indx.js"></script>
</head>
<body>
   <h2 class="mt-5 ms-5 p-0">Age To Days Converter</h2>
   <input type="number" id="input" placeholder="Enter your Age" class="ms-5 mt-2">
   <button id="button-1" class="ms-4" > Converter </button>
   <div class="ms-5 mt-4 fs-5 fw-bold" id="result"></div>

<script>
    document.getElementById("button-1").addEventListener('click',function(){
        const age = parseFloat(document.getElementById('input').value);
        if( !age || age <= 0 ){
        document.getElementById('result').textContent = "Please enter Valid Age.";
        return; 
        }
        const days = Math.floor(age * 365.25);
        document.getElementById('result').textContent =` You Are ${days} days. `;
    } )
    
</script>






   
</body>
</html>
